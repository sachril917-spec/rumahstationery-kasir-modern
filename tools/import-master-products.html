<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Master Barang ADL</title><style>body{font:16px system-ui;max-width:720px;margin:32px auto;padding:0 16px;color:#172033}label{display:block;margin:16px 0 6px}input{width:100%;padding:12px;box-sizing:border-box}button{margin-top:18px;padding:12px 20px;background:#1769d2;color:white;border:0;border-radius:8px;font-weight:700}progress{width:100%;height:20px;margin-top:16px}pre{white-space:pre-wrap;background:#f3f5f8;padding:12px;border-radius:8px}</style></head><body>
<h2>Import Master Barang ADL ke Cloudflare D1</h2><p>Import hanya data master berdasarkan <b>code</b>. Stok cabang tidak dikirim dan tidak diubah.</p>
<label>Alamat Worker</label><input id="api" value="https://rumah-stationery-api.sachril917.workers.dev">
<label>ADMIN_API_KEY</label><input id="key" type="password" autocomplete="off" placeholder="Tempel API key Admin">
<label>File JSON data barang</label><input id="file" type="file" accept=".json,application/json">
<button id="go">Mulai Import</button><progress id="progress" value="0" max="100"></progress><pre id="log">Menunggu file JSON.</pre>
<script>
const $=id=>document.getElementById(id);const log=s=>$('log').textContent=s;
$('go').onclick=async()=>{const f=$('file').files[0],key=$('key').value.trim(),base=$('api').value.trim().replace(/\/$/,'');if(!f||!key||!base){log('Lengkapi Worker, ADMIN_API_KEY, dan file JSON.');return;}$('go').disabled=true;try{const rows=JSON.parse(await f.text());if(!Array.isArray(rows)||!rows.length)throw Error('Format JSON harus berupa array barang.');let done=0;for(let i=0;i<rows.length;i+=100){const batch=rows.slice(i,i+100);const r=await fetch(base+'/admin/master-products/import',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({products:batch})});const data=await r.json();if(!r.ok||data.success!==true)throw Error('Batch '+(Math.floor(i/100)+1)+' gagal: '+(data.message||r.status));done+=batch.length;$('progress').value=Math.round(done/rows.length*100);log('Berhasil '+done.toLocaleString('id-ID')+' / '+rows.length.toLocaleString('id-ID')+' barang');}log('SELESAI. '+done.toLocaleString('id-ID')+' master barang sudah masuk ke server pusat.');}catch(e){log('IMPORT GAGAL: '+e.message+'\nPeriksa koneksi, API key, dan format file.');}finally{$('go').disabled=false;$('key').value='';}};
</script></body></html>
