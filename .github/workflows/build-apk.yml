name: Build Rumah Stationery Kasir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: rumah-stationery-android-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat platform Android
        run: flutter create --platforms=android .

      - name: Tentukan versi sebelum build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          REPO="${GITHUB_REPOSITORY}"
          LATEST_TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName // empty')"

          if [ -z "$LATEST_TAG" ]; then
            BASE_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1 | cut -d '+' -f 1)"
            NEXT_TAG="v$BASE_VERSION"
          else
            NEXT_TAG="$(python3 - "$LATEST_TAG" <<'PY'
          import re
          import sys

          tag = sys.argv[1].strip()
          match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)

          if not match:
              raise SystemExit(f"Format tag tidak valid: {tag}")

          major, minor, patch = map(int, match.groups())
          print(f"v{major}.{minor}.{patch + 1}")
          PY
          )"
          fi

          VERSION="${NEXT_TAG#v}"
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          echo "Versi APK: $VERSION"
          echo "Build number: $BUILD_NUMBER"

      - name: Atur identitas APK, signing, dan izin Android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          SIGN_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/adl-release.jks
          test -s /tmp/adl-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("build.gradle.kts tidak ditemukan")

          s = p.read_text()

          s, n = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.adl.rumahstationery.kasirpercobaan91"',
              s,
              count=1
          )

          if not n:
              raise SystemExit("applicationId tidak ditemukan")

          if 'create("adlRelease")' not in s:
              signing = '''
              signingConfigs {
                  create("adlRelease") {
                      storeFile = file("/tmp/adl-release.jks")
                      storePassword = System.getenv("STORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS_VALUE")
                      keyPassword = System.getenv("SIGN_PASSWORD")
                  }
              }
              '''
              s = s.replace("android {", "android {\n" + signing, 1)

          s, n = re.subn(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("adlRelease")',
              s
          )

          if not n:
              s, n = re.subn(
                  r'buildTypes\s*\{\s*getByName\("release"\)\s*\{',
                  'buildTypes { getByName("release") { signingConfig = signingConfigs.getByName("adlRelease")',
                  s,
                  count=1
              )

          if not n:
              raise SystemExit("Konfigurasi signing release tidak ditemukan")

          p.write_text(s)

          m = Path("android/app/src/main/AndroidManifest.xml")

          if not m.exists():
              raise SystemExit("AndroidManifest.xml tidak ditemukan")

          t = m.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          ]

          for permission in permissions:
              if permission not in t:
                  t = t.replace(
                      "<application",
                      f'    <uses-permission android:name="{permission}"/>\n    <application',
                      1
                  )

          m.write_text(t)
          PY

      - name: Unduh dependensi
        run: flutter pub get

      - name: Build APK
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -e

          test -n "$API_KEY"

          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define=API_KEY="$API_KEY"

      - name: Periksa APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"

      - name: Simpan APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumah-stationery-kasir-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Terbitkan APK ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "$TAG" "$APK#app-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rumah Stationery Kasir $TAG" \
            --notes "Pembaruan otomatis dari GitHub Actions.

          Commit: $GITHUB_SHA

          Versi: ${{ steps.version.outputs.version }}
          Build: ${{ steps.version.outputs.build_number }}"

      - name: Bersihkan keystore
        if: always()
        run: rm -f /tmp/adl-release.jks