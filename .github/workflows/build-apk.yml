
name: Build Rumah Stationery Kasir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat platform Android
        run: flutter create --platforms=android .

      - name: Atur identitas APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              p = Path("android/app/build.gradle")

          s = p.read_text()
          if p.name.endswith(".kts"):
              pattern = r'applicationId\s*=\s*"[^"]+"'
              replacement = 'applicationId = "com.adl.rumahstationery.kasirpercobaan91"'
          else:
              pattern = r'applicationId\s+"[^"]+"'
              replacement = 'applicationId "com.adl.rumahstationery.kasirpercobaan91"'

          s, n = re.subn(pattern, replacement, s, count=1)
          if not n:
              raise SystemExit("applicationId tidak ditemukan")
          p.write_text(s)

          m = Path("android/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1
              )
          m.write_text(s)
          PY

      - name: Siapkan keystore tetap
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Secret keystore belum lengkap."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/adl-release.jks
          test -s android/app/adl-release.jks

      - name: Konfigurasi tanda tangan release
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          SIGN_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Workflow ini memerlukan android/app/build.gradle.kts")

          s = p.read_text()
          signing = '''
          signingConfigs {
              create("adlRelease") {
                  storeFile = file("adl-release.jks")
                  storePassword = System.getenv("STORE_PASSWORD")
                  keyAlias = System.getenv("KEY_ALIAS_VALUE")
                  keyPassword = System.getenv("SIGN_PASSWORD")
              }
          }
          '''
          s = s.replace("android {", "android {\n" + signing, 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("adlRelease")'
          )
          p.write_text(s)
          PY

      - name: Unduh dependensi
        run: flutter pub get

      - name: Build APK
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "Secret API_KEY belum diatur"
            exit 1
          fi
          flutter build apk --release --dart-define=API_KEY="$API_KEY"

      - name: Periksa APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: rumah-stationery-kasir-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Bersihkan keystore
        if: always()
        run: rm -f android/app/adl-release.jks
